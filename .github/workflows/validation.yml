name: research-validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,report]'
      - run: python -m pytest
      - run: python scripts/run_simulations.py --quick
      - run: python scripts/verify_artifacts.py
      - run: python scripts/verify_v2_artifacts.py
