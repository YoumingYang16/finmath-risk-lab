[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finmath-risk-lab"
version = "2.0.0"
description = "Finite-data estimation and cost-aware option hedging research"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2", "scikit-learn>=1.5", "matplotlib>=3.8", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["python-docx>=1.1", "Pillow>=10"]

[tool.setuptools.packages.find]
include = ["risklab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
